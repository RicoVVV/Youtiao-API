[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtiao-api"
version = "0.1.0"
description = "Youtiao API 后端：基于 FastAPI、SQLAlchemy 与 PostgreSQL 的 AI 模型聚合网关"
readme = { text = "后端服务", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "aiohttp>=3.13,<4.0",
    "fastapi>=0.115,<1.0",
    "gunicorn>=23.0,<24.0",
    "httpx>=0.27,<1.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "psutil>=5.9,<8.0",
    "pydantic-settings>=2.5,<3.0",
    "PyJWT>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=43.0,<46.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.0,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "sqlmodel>=0.0.27,<0.1.0",
    "stripe>=11.0,<14.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]
extend-exclude = [".trae"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
