map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
    keepalive 32;
}

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;
    client_body_buffer_size 10m;
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    client_body_in_file_only clean;
    client_body_timeout 3600s;
    proxy_request_buffering on;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/rss+xml application/xml image/svg+xml text/css text/javascript text/plain;

    # 管理面例外：前端会把 /v1/admin/<rest> 改写为后端 /api/<rest>，必须交回前端处理。
    # 用 ^~ 前缀匹配，保证优先于下方的 API 正则匹配。
    location ^~ /v1/admin/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 后端直连：/api/**（平台管理面 + 千问/方舟厂商原生面）、/v1/**、/v1beta/**（对外兼容协议面）。
    # 不经前端中转，避免前端代理的超时与缓冲限制。
    location ~ ^/(?:api|v1|v1beta)/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        # 用 $http_host 保留外部端口：后端按 Host 生成成品下载绝对地址，端口丢失会导致地址不可访问
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        # 流式接口（对话/图像/视频与厂商原生流式）必须关闭响应缓冲与 gzip，否则分块会被攒着下发
        proxy_buffering off;
        gzip off;
    }

    location ^~ /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # 兜底：页面路由与其余前端资源。此处透传外部端口，避免前端重定向时丢失端口
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
