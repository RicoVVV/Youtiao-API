map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:3000 resolve;
    keepalive 32;
}

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
    # 空闲长连接缓存量按千级并发留足，避免高峰后反复握手。
    keepalive 128;
}

server {
    listen 80;
    server_name _;

    # 默认上限按普通 JSON 请求收敛；视频素材与图片编辑在各自 location 内单独放宽。
    # 过大的全局上限会让异常请求把整个请求体读进 worker 内存（见 BUG-20261025-01）。
    client_max_body_size 32m;
    # 普通请求只在内存缓冲 256k，超出部分由 nginx 自动落盘；不再强制每个请求写临时文件，
    # 千级并发下省掉每次请求的建文件、写入与删除开销，同时把单请求内存占用压到 256k。
    client_body_buffer_size 256k;
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    client_body_timeout 300s;
    proxy_request_buffering on;
    # 建连失败快速暴露，而不是沿用 60s 默认值；读超时按路径区分，管理面不跟随生成面的长超时。
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/rss+xml application/xml image/svg+xml text/css text/javascript text/plain;

    # 管理面例外：前端会把 /v1/admin/<rest> 改写为后端 /api/<rest>，必须交回前端处理。
    # 用 ^~ 前缀匹配，保证优先于下方的 API 正则匹配。
    location ^~ /v1/admin/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 视频：素材单文件最大 200 MB、单请求合计 512 MB，同步生成与成品下载都是长连接。
    # 网关上限按业务合计再加 multipart 余量，避免合法请求在 nginx 层被拦。
    location ^~ /v1/videos {
        client_max_body_size 544m;
        client_body_timeout 3600s;
        # 大请求体边收边转发：避免 nginx 先把数百 MB 落盘、再读回上游的双份磁盘 IO 与临时空间峰值。
        proxy_request_buffering off;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        gzip off;
    }

    # 图片编辑：最多 16 个输入文件、单文件 25 MB（上游 GPT Image 单图限制），业务合计 400 MB；
    # 网关按合计再加 multipart 余量，多张 4K 图片不会被提前拦截。
    location ^~ /v1/images/edits {
        client_max_body_size 448m;
        client_body_timeout 1800s;
        # 多图编辑同样边收边转发，避免 448 MB 请求体在网关侧重复落盘。
        proxy_request_buffering off;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_buffering off;
        gzip off;
    }

    # 千问 DashScope 与火山方舟原生生成端点：非流式生成可能持续到上游读超时。
    location ^~ /api/v1/services/aigc/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_buffering off;
        gzip off;
    }

    location ^~ /api/v3/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_buffering off;
        gzip off;
    }

    # 管理面与支付回调：请求体与响应都小，读超时沿用服务端默认 300s，
    # 避免 worker 卡死时连接挂满一小时才释放。
    location ^~ /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
    }

    # OpenAI / Anthropic / Gemini 公开协议面：流式分块必须透传，非流式长生成沿用上游读超时。
    # 用 $http_host 保留外部端口：后端按 Host 生成成品下载绝对地址，端口丢失会导致地址不可访问
    location ~ ^/(?:v1|v1beta)/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        # 流式接口（对话/图像/视频与厂商原生流式）必须关闭响应缓冲与 gzip，否则分块会被攒着下发
        proxy_read_timeout 1800s;
        proxy_buffering off;
        gzip off;
    }

    location ^~ /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # 兜底：页面路由与其余前端资源。此处透传外部端口，避免前端重定向时丢失端口
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
