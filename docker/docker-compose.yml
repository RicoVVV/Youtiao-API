# 安全说明：本文件不包含任何真实密钥，所有敏感值均在运行时由环境变量注入。
# 使用前请在 docker/ 目录下创建 .env（该文件已被 .gitignore 忽略），至少提供：
#   POSTGRES_PASSWORD=一个高强度随机口令
#   JWT_SIGNING_KEY=至少 32 位的随机字符串
#   REFRESH_TOKEN_PEPPER=另一个至少 32 位的随机字符串
# 上面三项使用 ${VAR:?提示} 语法强制要求，缺失时 compose 会直接报错退出，
# 目的是避免有人误用弱口令或空值把服务启动起来。
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=500"]
    ports:
      - "5432:5432"   # 宿主机端口:容器端口，宿主机侧可改成任意空闲端口
    environment:
      # 数据库名与用户名可用默认值，口令必须由部署环境提供，禁止写死在仓库里。
      POSTGRES_DB: ${POSTGRES_DB:-youtiao-api}
      POSTGRES_USER: ${POSTGRES_USER:-youtiao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    environment:
      APP_ENV: production
      # 数据库连接串复用上方的用户名/口令变量，避免在多处重复维护同一口令。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-youtiao}:${POSTGRES_PASSWORD:?请在 docker/.env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-youtiao-api}
      # JWT 签名密钥与刷新令牌 Pepper 必须由部署环境注入；config.py 会拒绝非开发环境使用弱值。
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?请在 docker/.env 中设置 JWT_SIGNING_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-youtiao-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-youtiao-api-clients}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?请在 docker/.env 中设置 REFRESH_TOKEN_PEPPER}
      # 支付凭据加密密钥：仅在启用支付功能时需要（Fernet 密钥）；留空时支付配置读写接口会报错。
      PAYMENT_CONFIG_ENCRYPTION_KEY: ${PAYMENT_CONFIG_ENCRYPTION_KEY:-}
      ACCESS_TOKEN_MINUTES: "1440"
      REFRESH_TOKEN_DAYS: "30"
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
      CORS_ALLOW_ORIGINS: '[]'
      AUTH_REDIS_URL: redis://redis:6379/2
      DATABASE_POOL_SIZE: "16"
      DATABASE_MAX_OVERFLOW: "4"
      DATABASE_ASYNC_POOL_SIZE: "36"
      DATABASE_ASYNC_MAX_OVERFLOW: "6"
      DATABASE_POOL_TIMEOUT_SECONDS: "30"
      PROVIDER_READ_TIMEOUT_SECONDS: "1800"
      VIDEO_TASK_TIMEOUT_SECONDS: "86400"
      VIDEO_MAINTENANCE_BATCH_SIZE: "100"
      MEDIA_ROOT: /app/media
    command: ["gunicorn", "app.main:app", "--bind", "0.0.0.0:8000", "--workers", "8", "--worker-class", "uvicorn.workers.UvicornWorker", "--timeout", "3600", "--access-logfile", "-", "--error-logfile", "-"]
    volumes:
      - media_data:/app/media
      # 服务器资源监控：宿主 procfs 用于 CPU、内存、负载与网络计数，
      # 宿主根目录用于读取真实分区容量；两者均只读挂载，采集侧只读不写。
      - /proc:/host/proc:ro
      - /:/host:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirrors.cloud.tencent.com/npm/}
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://api:8000}
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://api:8000}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:1.27.3-alpine
    # 全站唯一对外入口：前端页面与后端接口共用该端口，由 nginx 按路径分流
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  nginx_cache:
